<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0D0E11">
  <title>Your free audit | SocialEngine</title>
  <meta name="description" content="Your free SocialEngine social media audit.">
  <link rel="preload" href="./fonts/figtree-latin-var-4ba7d3d0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./chrome.css">
  <style>
    .ar-pulse { width: 14px; height: 14px; border-radius: 50%; background: #9D8CFF; box-shadow: 0 0 0 0 rgba(157,140,255,0.5); animation: ar-pulse 1.8s ease-out infinite; }
    @keyframes ar-pulse { 0% { box-shadow: 0 0 0 0 rgba(157,140,255,0.5); } 100% { box-shadow: 0 0 0 18px rgba(157,140,255,0); } }
    @media (prefers-reduced-motion: reduce) { .ar-pulse { animation: none; } }
  </style>
</head>
<body>
<a href="#audit-root" class="sr-only skip-link">Skip to content</a>
<div style="background: #0D0E11; color: #E8E6E1; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; line-height: 1.55">

  <header style="max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
    <a href="/" aria-label="SocialEngine home" style="display: flex; align-items: center; gap: 10px; color: #E8E6E1; text-decoration: none; font-weight: 500; font-size: 18px; letter-spacing: -0.01em">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" style="fill: none"><defs><linearGradient id="ar-chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F1EE"></stop><stop offset="0.55" stop-color="#8D8A83"></stop><stop offset="1" stop-color="#D9D7D2"></stop></linearGradient></defs><circle cx="11" cy="16" r="3.6" style="fill: url(#ar-chrome)"></circle><circle cx="21.5" cy="10" r="2.6" style="fill: url(#ar-chrome)"></circle><circle cx="21.5" cy="22" r="2.6" style="fill: url(#ar-chrome)"></circle><path d="M13.8 14.6 19.5 11.2 M13.8 17.4 19.5 20.8" style="stroke: #A3A09A; stroke-width: 1.6; stroke-linecap: round"></path></svg>
      SocialEngine
    </a>
    <span id="audit-pill" hidden style="display: inline-flex; align-items: center; height: 30px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; border: 1px solid #282C34; font-size: 12.5px; color: #A3A09A; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"></span>
  </header>

  <main id="audit-root" aria-busy="true" tabindex="-1" style="max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 24px 24px 100px; display: flex; flex-direction: column; gap: 72px; min-height: 60vh">
    <section role="status" aria-live="polite" style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 48px 0">
      <span class="ar-pulse" aria-hidden="true"></span>
      <h1 style="margin: 0; font-size: clamp(30px, 4vw, 44px); line-height: 1.08; font-weight: 500; letter-spacing: -0.03em">Loading your audit</h1>
      <noscript><p style="margin: 0; color: #A3A09A">This page needs JavaScript to show your audit.</p></noscript>
    </section>
  </main>
</div>

<script src="./audit.js" defer></script>
</body>
</html>
