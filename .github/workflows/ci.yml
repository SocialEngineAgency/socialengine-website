name: CI
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Unit tests + Netlify publish-allowlist build test (Node built-ins only, no npm install needed)
      - run: npm test

  # Portal ↔ API session contract (login / Bearer / storage / logout / 401 /
  # oauth-start) against a mocked API. Hermetic: no network beyond localhost.
  portal-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:sessions
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-sessions
          path: test-results/
          retention-days: 7

  # Portal nav / Settings / Coach / errors / Content Review archive+refresh /
  # Animate VO-first against a mocked API. Hermetic like portal-sessions.
  portal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:portal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-portal
          path: test-results/
          retention-days: 7
